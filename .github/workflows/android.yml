# 인연큐레이터 안드로이드 앱 자동 빌드: main 에 올리면(또는 Actions 탭에서 Run workflow) AAB/APK 를 만들어 Releases 에 올려 줌
name: Android build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'ios/**', '.github/workflows/ios.yml', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK 36 설치
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 업로드 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret 이 없어 서명 안 된 빌드를 만듭니다 (Play 업로드 불가)"
          fi

      - name: 푸시 설정 (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python3 -c "import json;d=json.load(open('app/google-services.json'));print('FCM 프로젝트:',d['project_info']['project_id'])"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret 이 없어 푸시 알림 없이 빌드합니다"
          fi

      - name: 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease :app:assembleDebug

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/inyeon-1.0.${BUILD_NUMBER}-test.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk "out/inyeon-1.0.${BUILD_NUMBER}-release.apk"; fi
          cp app/build/outputs/bundle/release/app-release.aab "out/inyeon-1.0.${BUILD_NUMBER}.aab"

      - name: 서명 인증서 확인
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do
            fp=$("$AS" verify --print-certs "$f" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "::notice title=$(basename $f)::cert SHA-256 $fp"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: inyeon-${{ github.run_number }}
          path: out/*
          retention-days: 30

      # 휴대폰에서 바로 받을 수 있게 GitHub 릴리스에 올림 (저장소 Releases 메뉴)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 인연큐레이터 1.0.${{ github.run_number }}
          prerelease: true
          body: |
            - 휴대폰 테스트 설치: `inyeon-1.0.${{ github.run_number }}-test.apk` 를 휴대폰에서 받아 설치
            - Play Console 업로드: `inyeon-1.0.${{ github.run_number }}.aab`
          files: out/*
