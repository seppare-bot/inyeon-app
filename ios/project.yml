# XcodeGen 설정 — GitHub Actions(macOS)에서 `xcodegen generate` 로 Inyeon.xcodeproj 를 만든다 (Mac 없이 관리)
name: Inyeon
options:
  bundleIdPrefix: com.inyeoncurator
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Inyeon:
    type: application
    platform: iOS
    sources:
      - path: Inyeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inyeoncurator.app
        PRODUCT_NAME: Inyeon
        INFOPLIST_FILE: Inyeon/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"   # 아이폰 전용 (아이패드 스크린샷·심사 불필요)
